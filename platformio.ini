; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Programas en src/ (cada entorno compila solo su carpeta):
;   pio run -e az-delivery-devkit-v4 -t upload   firmware real        (src/firmware)
;   pio run -e ble-sim -t upload                 simulador BLE        (src/ble_sim)
;   pio run -e nextion-sim -t upload             simulador pantalla   (src/nextion_sim)
;   pio run -e nextion-sim-2esp -t upload        simulador pantalla en Serial2, con puente (src/nextion_sim)
;   pio run -e bridge -t upload                  puente USB <-> UART  (src/bridge)
;   pio run -e nextion_test -t upload            probador de pantalla (tools/nextion_tester)

; Común a todos los entornos
[env]
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino
monitor_speed = 115200

lib_deps = 
   h2zero/NimBLE-Arduino@^2.5.1
   seithan/Easy Nextion Library@^1.0.6 

build_flags =
   -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; Pruebas (pio test)
test_framework = unity
test_speed = 115200

; Firmware real
[env:az-delivery-devkit-v4]
build_src_filter = +<firmware/>

; Simulador BLE: signos y alarmas de prueba para la app, sin sensores
[env:ble-sim]
build_src_filter = +<ble_sim/>

; Simulador de la pantalla: Nextion Editor (debugger por USB) o pantalla física, sin sensores
[env:nextion-sim]
build_src_filter = +<nextion_sim/>

; Simulador de la pantalla con dos ESP32: el Nextion Editor llega por el puente a Serial2
; y el USB queda libre para los comandos y avisos del simulador
[env:nextion-sim-2esp]
build_src_filter = +<nextion_sim/>
build_flags =
   ${env.build_flags}
   -DSIM_PANTALLA_FISICA=1

; Puente USB <-> UART (segundo ESP32 como adaptador USB-TTL)
[env:bridge]
build_src_filter = +<bridge/>
lib_deps =

; Probador de la pantalla Nextion (tools/nextion_tester): no usa los sensores
;   pio run -e nextion_test -t upload && pio device monitor
[env:nextion_test]
build_src_filter = +<../tools/nextion_tester/>
