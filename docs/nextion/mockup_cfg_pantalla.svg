<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="Arial, Helvetica, sans-serif">
  <!-- Fondo de la página (bco 2146) -->
  <rect width="800" height="480" fill="#0B0F14"/>

  <!-- Barra de estado -->
  <rect x="0" y="0" width="800" height="40" fill="#151C24"/>
  <text x="64" y="20" font-size="20" fill="#D8DEE6" text-anchor="middle" dominant-baseline="central">Adulto</text>
  <text x="338" y="20" font-size="24" font-weight="bold" fill="#D8DEE6" text-anchor="middle" dominant-baseline="central">Configuración · Pantalla</text>
  <text x="670" y="20" font-size="20" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">BLE</text>
  <text x="750" y="20" font-size="20" fill="#D8DEE6" text-anchor="middle" dominant-baseline="central">14:32</text>

  <!-- Pestañas: Pantalla activa -->
  <g font-size="20" dominant-baseline="central">
    <rect x="0" y="40" width="160" height="65" fill="#11171E"/>
    <text x="20" y="72" fill="#D8DEE6">Alarmas</text>
    <rect x="0" y="105" width="160" height="65" fill="#11171E"/>
    <text x="20" y="137" fill="#D8DEE6">Paciente</text>
    <rect x="0" y="170" width="160" height="65" fill="#1C2A38"/>
    <rect x="0" y="170" width="4" height="65" fill="#378ADD"/>
    <text x="20" y="202" fill="#FFFFFF">Pantalla</text>
    <rect x="0" y="235" width="160" height="65" fill="#11171E"/>
    <text x="20" y="267" fill="#D8DEE6">Bluetooth</text>
    <rect x="0" y="300" width="160" height="65" fill="#11171E"/>
    <text x="20" y="332" fill="#D8DEE6">Servicio</text>
  </g>
  <g stroke="#222B35" stroke-width="1">
    <line x1="0" y1="104.5" x2="160" y2="104.5"/>
    <line x1="0" y1="169.5" x2="160" y2="169.5"/>
    <line x1="0" y1="234.5" x2="160" y2="234.5"/>
    <line x1="0" y1="299.5" x2="160" y2="299.5"/>
    <line x1="0" y1="364.5" x2="160" y2="364.5"/>
  </g>

  <!-- Encabezado -->
  <text x="180" y="66" font-size="16" fill="#8A96A3" dominant-baseline="central">Pantalla y reloj</text>

  <!-- Separadores de filas (y = 90, 146, 202, 258, 314, 370) -->
  <g stroke="#222B35" stroke-width="1">
    <line x1="170" y1="90.5" x2="790" y2="90.5"/>
    <line x1="170" y1="146.5" x2="790" y2="146.5"/>
    <line x1="170" y1="202.5" x2="790" y2="202.5"/>
    <line x1="170" y1="258.5" x2="790" y2="258.5"/>
    <line x1="170" y1="314.5" x2="790" y2="314.5"/>
    <line x1="170" y1="370.5" x2="790" y2="370.5"/>
    <line x1="0" y1="429.5" x2="800" y2="429.5"/>
  </g>

  <!-- Nombres de fila -->
  <g font-size="20" fill="#D8DEE6" dominant-baseline="central">
    <text x="180" y="118">Brillo</text>
    <text x="180" y="174">Hora</text>
    <text x="180" y="230">Fecha</text>
    <text x="180" y="342">Barrido mm/s</text>
    <text x="180" y="398">Sonido al tocar</text>
  </g>

  <!-- Brillo (Slider 260x30, min 20): igual que Volumen en Alarmas -->
  <text x="420" y="118" font-size="16" fill="#8A96A3" dominant-baseline="central">20%</text>
  <rect x="460" y="114" width="260" height="8" rx="4" fill="#3A4654"/>
  <rect x="460" y="114" width="208" height="8" rx="4" fill="#378ADD"/>
  <circle cx="668" cy="118" r="11" fill="#D8DEE6"/>
  <text x="790" y="118" font-size="24" font-weight="bold" fill="#D8DEE6" text-anchor="end" dominant-baseline="central">80%</text>

  <!-- Hora: dos steppers en la grilla de Alarmas (420 / 610) -->
  <g font-size="24" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <rect x="420" y="154" width="48" height="40" fill="#3A4654"/><text x="444" y="174" fill="#FFFFFF">−</text>
    <text x="510" y="174" fill="#D8DEE6">14</text>
    <rect x="552" y="154" width="48" height="40" fill="#3A4654"/><text x="576" y="174" fill="#FFFFFF">+</text>
    <text x="605" y="174" fill="#8A96A3">:</text>
    <rect x="610" y="154" width="48" height="40" fill="#3A4654"/><text x="634" y="174" fill="#FFFFFF">−</text>
    <text x="700" y="174" fill="#D8DEE6">32</text>
    <rect x="742" y="154" width="48" height="40" fill="#3A4654"/><text x="766" y="174" fill="#FFFFFF">+</text>
  </g>

  <!-- Fecha: tres steppers compactos (40 + valor + 40) -->
  <g font-size="24" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <rect x="330" y="210" width="40" height="40" fill="#3A4654"/><text x="350" y="230" fill="#FFFFFF">−</text>
    <text x="398" y="230" fill="#D8DEE6">02</text>
    <rect x="426" y="210" width="40" height="40" fill="#3A4654"/><text x="446" y="230" fill="#FFFFFF">+</text>
    <text x="471" y="230" fill="#8A96A3">/</text>
    <rect x="476" y="210" width="40" height="40" fill="#3A4654"/><text x="496" y="230" fill="#FFFFFF">−</text>
    <text x="544" y="230" fill="#D8DEE6">11</text>
    <rect x="572" y="210" width="40" height="40" fill="#3A4654"/><text x="592" y="230" fill="#FFFFFF">+</text>
    <text x="617" y="230" fill="#8A96A3">/</text>
    <rect x="622" y="210" width="40" height="40" fill="#3A4654"/><text x="642" y="230" fill="#FFFFFF">−</text>
    <text x="701" y="230" fill="#D8DEE6">2026</text>
    <rect x="740" y="210" width="40" height="40" fill="#3A4654"/><text x="760" y="230" fill="#FFFFFF">+</text>
  </g>

  <!-- Guardar fecha y hora (los steppers no tocan el RTC hasta aquí) -->
  <text x="180" y="286" font-size="16" fill="#8A96A3" dominant-baseline="central">El reloj sigue corriendo; se ajusta al guardar.</text>
  <rect x="580" y="266" width="210" height="40" fill="#378ADD"/>
  <text x="685" y="286" font-size="20" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Guardar hora</text>

  <!-- Barrido de las ondas: 3 Dual-state (118x40), solo uno activo -->
  <g font-size="20" text-anchor="middle" dominant-baseline="central">
    <rect x="420" y="322" width="118" height="40" fill="#3A4654"/>
    <text x="479" y="342" fill="#D8DEE6">12.5</text>
    <rect x="546" y="322" width="118" height="40" fill="#378ADD"/>
    <text x="605" y="342" fill="#FFFFFF" font-weight="bold">25</text>
    <rect x="672" y="322" width="118" height="40" fill="#3A4654"/>
    <text x="731" y="342" fill="#D8DEE6">50</text>
  </g>

  <!-- Sonido al tocar: Dual-state 70x36 (ON en verde) -->
  <rect x="420" y="380" width="70" height="36" fill="#1D9E75"/>
  <text x="455" y="398" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ON</text>
  <text x="790" y="398" font-size="16" fill="#8A96A3" text-anchor="end" dominant-baseline="central">Clic corto del buzzer en cada toque</text>

  <!-- Teclas -->
  <g font-size="20" text-anchor="middle" dominant-baseline="central">
    <rect x="640" y="434" width="152" height="42" fill="#151C24"/>
    <text x="716" y="455" fill="#85B7EB">Volver</text>
  </g>
</svg>
