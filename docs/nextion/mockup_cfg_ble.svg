<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="Arial, Helvetica, sans-serif">
  <!-- Fondo de la página (bco 2146) -->
  <rect width="800" height="480" fill="#0B0F14"/>

  <!-- Barra de estado (sin alarma activa) -->
  <rect x="0" y="0" width="800" height="40" fill="#151C24"/>
  <text x="64" y="20" font-size="20" fill="#D8DEE6" text-anchor="middle" dominant-baseline="central">Adulto</text>
  <text x="338" y="20" font-size="24" font-weight="bold" fill="#D8DEE6" text-anchor="middle" dominant-baseline="central">Configuración · Bluetooth</text>
  <text x="670" y="20" font-size="20" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">BLE</text>
  <text x="750" y="20" font-size="20" fill="#D8DEE6" text-anchor="middle" dominant-baseline="central">14:32</text>

  <!-- Pestañas (x=0, w=160, h=65) -->
  <g font-size="20" dominant-baseline="central">
    <rect x="0" y="40" width="160" height="65" fill="#11171E"/>
    <text x="20" y="72" fill="#D8DEE6">Alarmas</text>
    <rect x="0" y="105" width="160" height="65" fill="#11171E"/>
    <text x="20" y="137" fill="#D8DEE6">Paciente</text>
    <rect x="0" y="170" width="160" height="65" fill="#11171E"/>
    <text x="20" y="202" fill="#D8DEE6">Señales</text>
    <rect x="0" y="235" width="160" height="65" fill="#11171E"/>
    <text x="20" y="267" fill="#D8DEE6">Pantalla</text>
    <rect x="0" y="300" width="160" height="65" fill="#1C2A38"/>
    <rect x="0" y="300" width="4" height="65" fill="#378ADD"/>
    <text x="20" y="332" fill="#FFFFFF">Bluetooth</text>
    <rect x="0" y="365" width="160" height="65" fill="#11171E"/>
    <rect x="20" y="398" width="12" height="9" rx="1" fill="#8A96A3"/>
    <path d="M22,398 V393 A4,4 0 0 1 30,393 V398" fill="none" stroke="#8A96A3" stroke-width="2"/>
    <text x="40" y="397" fill="#8A96A3">Servicio</text>
  </g>
  <g stroke="#222B35" stroke-width="1">
    <line x1="0" y1="104.5" x2="160" y2="104.5"/>
    <line x1="0" y1="169.5" x2="160" y2="169.5"/>
    <line x1="0" y1="234.5" x2="160" y2="234.5"/>
    <line x1="0" y1="299.5" x2="160" y2="299.5"/>
    <line x1="0" y1="364.5" x2="160" y2="364.5"/>
  </g>

  
  <g stroke="#222B35" stroke-width="1">
    <line x1="170" y1="90.5" x2="790" y2="90.5"/>
    <line x1="170" y1="146.5" x2="790" y2="146.5"/>
    <line x1="170" y1="202.5" x2="790" y2="202.5"/>
    <line x1="170" y1="258.5" x2="790" y2="258.5"/>
    <line x1="170" y1="314.5" x2="790" y2="314.5"/>
    <line x1="170" y1="370.5" x2="790" y2="370.5"/>
    <line x1="0" y1="429.5" x2="800" y2="429.5"/>
  </g>
  <text x="180" y="66" font-size="16" fill="#8A96A3" dominant-baseline="central">Envío de signos vitales y alarmas a la app por Bluetooth Low Energy</text>
  <g font-size="20" fill="#D8DEE6" dominant-baseline="central">
    <text x="180" y="118">Bluetooth</text>
    <text x="180" y="174">Estado</text>
    <text x="180" y="230">Nombre</text>
    <text x="180" y="286">Intervalo</text>
    <text x="180" y="342">Conexión</text>
  </g>
  <rect x="330" y="100" width="70" height="36" fill="#1D9E75"/>
  <text x="365" y="118" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">ON</text>
  <text x="420" y="118" font-size="16" fill="#8A96A3" dominant-baseline="central">Apagar si no se usa la app</text>
  <circle cx="340" cy="174" r="7" fill="#85B7EB"/>
  <text x="356" y="174" font-size="20" font-weight="bold" fill="#85B7EB" dominant-baseline="central">Conectado</text>
  <text x="330" y="230" font-size="20" fill="#D8DEE6" dominant-baseline="central">MonitorSV</text>
  <g font-size="20" text-anchor="middle" dominant-baseline="central">
    <rect x="330" y="266" width="96" height="40" fill="#378ADD"/><text x="378" y="286" fill="#FFFFFF" font-weight="bold">1 s</text>
    <rect x="432" y="266" width="96" height="40" fill="#3A4654"/><text x="480" y="286" fill="#D8DEE6">2 s</text>
    <rect x="534" y="266" width="96" height="40" fill="#3A4654"/><text x="582" y="286" fill="#D8DEE6">5 s</text>
    <rect x="330" y="322" width="200" height="40" fill="#3A4654"/><text x="430" y="342" fill="#F09595">Desconectar</text>
  </g>
  <text x="180" y="398" font-size="16" fill="#8A96A3" dominant-baseline="central">Los cambios se aplican al instante.</text>
  <g font-size="20" text-anchor="middle" dominant-baseline="central">
    <rect x="640" y="434" width="152" height="42" fill="#151C24"/>
    <text x="716" y="455" fill="#85B7EB">Volver</text>
  </g>
</svg>