<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="Arial, Helvetica, sans-serif">
  <!-- Fondo de la página (bco 2146) -->
  <rect width="800" height="480" fill="#0B0F14"/>

  <!-- Barra de estado (sin alarma activa) -->
  <rect x="0" y="0" width="800" height="40" fill="#151C24"/>
  <text x="64" y="20" font-size="20" fill="#D8DEE6" text-anchor="middle" dominant-baseline="central">Adulto</text>
  <text x="338" y="20" font-size="24" font-weight="bold" fill="#D8DEE6" text-anchor="middle" dominant-baseline="central">Configuración · Paciente</text>
  <text x="670" y="20" font-size="20" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">BLE</text>
  <text x="750" y="20" font-size="20" fill="#D8DEE6" text-anchor="middle" dominant-baseline="central">14:32</text>

  <!-- Pestañas (x=0, w=160, h=65) -->
  <g font-size="20" dominant-baseline="central">
    <rect x="0" y="40" width="160" height="65" fill="#11171E"/>
    <text x="20" y="72" fill="#D8DEE6">Alarmas</text>
    <rect x="0" y="105" width="160" height="65" fill="#1C2A38"/>
    <rect x="0" y="105" width="4" height="65" fill="#378ADD"/>
    <text x="20" y="137" fill="#FFFFFF">Paciente</text>
    <rect x="0" y="170" width="160" height="65" fill="#11171E"/>
    <text x="20" y="202" fill="#D8DEE6">Señales</text>
    <rect x="0" y="235" width="160" height="65" fill="#11171E"/>
    <text x="20" y="267" fill="#D8DEE6">Pantalla</text>
    <rect x="0" y="300" width="160" height="65" fill="#11171E"/>
    <text x="20" y="332" fill="#D8DEE6">Bluetooth</text>
    <rect x="0" y="365" width="160" height="65" fill="#11171E"/>
    <rect x="20" y="398" width="12" height="9" rx="1" fill="#8A96A3"/>
    <path d="M22,398 V393 A4,4 0 0 1 30,393 V398" fill="none" stroke="#8A96A3" stroke-width="2"/>
    <text x="40" y="397" fill="#8A96A3">Servicio</text>
  </g>
  <g stroke="#222B35" stroke-width="1">
    <line x1="0" y1="104.5" x2="160" y2="104.5"/>
    <line x1="0" y1="169.5" x2="160" y2="169.5"/>
    <line x1="0" y1="234.5" x2="160" y2="234.5"/>
    <line x1="0" y1="299.5" x2="160" y2="299.5"/>
    <line x1="0" y1="364.5" x2="160" y2="364.5"/>
  </g>

  <!-- Encabezado -->
  <text x="180" y="66" font-size="16" fill="#8A96A3" dominant-baseline="central">Datos del paciente</text>

  <!-- Separadores de filas (y = 90, 146, 202, 258, 314, 370) -->
  <g stroke="#222B35" stroke-width="1">
    <line x1="170" y1="90.5" x2="790" y2="90.5"/>
    <line x1="170" y1="146.5" x2="790" y2="146.5"/>
    <line x1="170" y1="202.5" x2="790" y2="202.5"/>
    <line x1="170" y1="258.5" x2="790" y2="258.5"/>
    <line x1="170" y1="314.5" x2="790" y2="314.5"/>
    <line x1="0" y1="429.5" x2="800" y2="429.5"/>
  </g>

  <!-- Nombres de fila -->
  <g font-size="20" fill="#D8DEE6" dominant-baseline="central">
    <text x="180" y="118">Tipo</text>
    <text x="180" y="174">ID paciente</text>
    <text x="180" y="230">Cama</text>
    <text x="180" y="286">Monitoreo</text>
  </g>

  <!-- Tipo: 2 Dual-state buttons (180x40), solo uno activo (grupo radio) -->
  <g font-size="20" text-anchor="middle" dominant-baseline="central">
    <rect x="420" y="98" width="180" height="40" fill="#378ADD"/>
    <text x="510" y="118" fill="#FFFFFF" font-weight="bold">Adulto</text>
    <rect x="610" y="98" width="180" height="40" fill="#3A4654"/>
    <text x="700" y="118" fill="#D8DEE6">Pediátrico</text>
  </g>

  <!-- ID: Text (300x40) que abre el teclado del sistema (keybdA) -->
  <rect x="420" y="154" width="300" height="40" fill="#151C24" stroke="#3A4654" stroke-width="1"/>
  <text x="432" y="174" font-size="20" fill="#D8DEE6" dominant-baseline="central">HC-004512</text>
  <text x="790" y="174" font-size="16" fill="#8A96A3" text-anchor="end" dominant-baseline="central">Abc</text>

  <!-- Cama: stepper igual que en Alarmas -->
  <g font-size="24" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <rect x="420" y="210" width="48" height="40" fill="#3A4654"/><text x="444" y="230" fill="#FFFFFF">−</text>
    <text x="510" y="230" fill="#D8DEE6">12</text>
    <rect x="552" y="210" width="48" height="40" fill="#3A4654"/><text x="576" y="230" fill="#FFFFFF">+</text>
  </g>
  <text x="610" y="230" font-size="16" fill="#8A96A3" dominant-baseline="central">Va con los datos por BLE</text>

  <!-- Monitoreo: hora de "Nuevo paciente" (RTC del Nextion) y tiempo transcurrido (solo lectura) -->
  <text x="420" y="286" font-size="20" fill="#D8DEE6" dominant-baseline="central">Desde 08:15</text>
  <text x="790" y="286" font-size="16" fill="#8A96A3" text-anchor="end" dominant-baseline="central">6 h 17 min</text>

  <!-- Nota -->
  <text x="180" y="342" font-size="16" fill="#8A96A3" dominant-baseline="central">Cambiar el tipo pone los límites de alarma por defecto de ese tipo.</text>
  <text x="180" y="368" font-size="16" fill="#8A96A3" dominant-baseline="central">Nuevo paciente también borra la calibración de PA.</text>

  <!-- Teclas -->
  <g font-size="20" text-anchor="middle" dominant-baseline="central">
    <rect x="8" y="434" width="152" height="42" fill="#151C24"/>
    <text x="84" y="455" fill="#EF9F27">Nuevo paciente</text>
    <rect x="640" y="434" width="152" height="42" fill="#151C24"/>
    <text x="716" y="455" fill="#85B7EB">Volver</text>
  </g>
</svg>
