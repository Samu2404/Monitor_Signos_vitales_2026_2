<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="Arial, Helvetica, sans-serif">
  <!-- Fondo de la página (bco 2146) -->
  <rect width="800" height="480" fill="#0B0F14"/>

  <!-- Barra de estado (sin alarma activa) -->
  <rect x="0" y="0" width="800" height="40" fill="#151C24"/>
  <text x="64" y="20" font-size="20" fill="#D8DEE6" text-anchor="middle" dominant-baseline="central">Adulto</text>
  <text x="338" y="20" font-size="24" font-weight="bold" fill="#D8DEE6" text-anchor="middle" dominant-baseline="central">Configuración · Servicio</text>
  <text x="670" y="20" font-size="20" fill="#85B7EB" text-anchor="middle" dominant-baseline="central">BLE</text>
  <text x="750" y="20" font-size="20" fill="#D8DEE6" text-anchor="middle" dominant-baseline="central">14:32</text>

  <!-- Pestañas (x=0, w=160, h=65): sin Señales, Servicio sube un lugar -->
  <g font-size="20" dominant-baseline="central">
    <rect x="0" y="40" width="160" height="65" fill="#11171E"/>
    <text x="20" y="72" fill="#D8DEE6">Alarmas</text>
    <rect x="0" y="105" width="160" height="65" fill="#11171E"/>
    <text x="20" y="137" fill="#D8DEE6">Paciente</text>
    <rect x="0" y="170" width="160" height="65" fill="#11171E"/>
    <text x="20" y="202" fill="#D8DEE6">Pantalla</text>
    <rect x="0" y="235" width="160" height="65" fill="#11171E"/>
    <text x="20" y="267" fill="#D8DEE6">Bluetooth</text>
    <rect x="0" y="300" width="160" height="65" fill="#1C2A38"/>
    <rect x="0" y="300" width="4" height="65" fill="#378ADD"/>
    <text x="20" y="332" fill="#FFFFFF">Servicio</text>
  </g>
  <g stroke="#222B35" stroke-width="1">
    <line x1="0" y1="104.5" x2="160" y2="104.5"/>
    <line x1="0" y1="169.5" x2="160" y2="169.5"/>
    <line x1="0" y1="234.5" x2="160" y2="234.5"/>
    <line x1="0" y1="299.5" x2="160" y2="299.5"/>
    <line x1="0" y1="364.5" x2="160" y2="364.5"/>
  </g>

  <!-- Encabezado -->
  <text x="180" y="66" font-size="16" fill="#8A96A3" dominant-baseline="central">Diagnóstico y pruebas</text>

  <!-- Separadores de filas (y = 90, 146, 202, 258, 314, 370) -->
  <g stroke="#222B35" stroke-width="1">
    <line x1="170" y1="90.5" x2="790" y2="90.5"/>
    <line x1="170" y1="146.5" x2="790" y2="146.5"/>
    <line x1="170" y1="202.5" x2="790" y2="202.5"/>
    <line x1="170" y1="258.5" x2="790" y2="258.5"/>
    <line x1="170" y1="314.5" x2="790" y2="314.5"/>
    <line x1="170" y1="370.5" x2="790" y2="370.5"/>
    <line x1="0" y1="429.5" x2="800" y2="429.5"/>
  </g>

  <!-- Nombres de fila -->
  <g font-size="20" fill="#D8DEE6" dominant-baseline="central">
    <text x="180" y="118">AFE4950</text>
    <text x="180" y="174">Puente temp</text>
    <text x="180" y="230">Modo demo</text>
    <text x="180" y="286">Pruebas</text>
    <text x="180" y="342">Equipo</text>
  </g>

  <!-- AFE4950: OK en verde (5DCAA5) o código de error en rojo (F09595) -->
  <text x="420" y="118" font-size="24" font-weight="bold" fill="#F09595" dominant-baseline="central">Error 0x02</text>
  <text x="790" y="118" font-size="16" fill="#8A96A3" text-anchor="end" dominant-baseline="central">Registro 0x1D no coincide</text>

  <!-- Puente temp: mV del ADC -->
  <text x="420" y="174" font-size="24" font-weight="bold" fill="#D8DEE6" dominant-baseline="central">412 mV</text>
  <text x="790" y="174" font-size="16" fill="#8A96A3" text-anchor="end" dominant-baseline="central">ADC1 · GPIO34</text>

  <!-- Modo demo: Dual-state 70x36 (OFF) -->
  <rect x="420" y="212" width="70" height="36" fill="#3A4654"/>
  <text x="455" y="230" font-size="20" font-weight="bold" fill="#D8DEE6" text-anchor="middle" dominant-baseline="central">OFF</text>
  <text x="790" y="230" font-size="16" fill="#8A96A3" text-anchor="end" dominant-baseline="central">Señales simuladas · "DEMO" en la barra</text>

  <!-- Pruebas (Button 180x40) -->
  <g font-size="20" text-anchor="middle" dominant-baseline="central">
    <rect x="420" y="266" width="180" height="40" fill="#3A4654"/>
    <text x="510" y="286" fill="#FFFFFF">Probar LEDs</text>
    <rect x="610" y="266" width="180" height="40" fill="#3A4654"/>
    <text x="700" y="286" fill="#FFFFFF">Probar buzzer</text>
  </g>

  <!-- Equipo: reiniciar (con confirmación) -->
  <rect x="420" y="322" width="180" height="40" fill="#3A4654"/>
  <text x="510" y="342" font-size="20" fill="#EF9F27" text-anchor="middle" dominant-baseline="central">Reiniciar</text>

  <!-- Enlace UART con la pantalla: OK en verde o código de error en rojo (igual que el AFE) -->
  <text x="180" y="398" font-size="20" fill="#D8DEE6" dominant-baseline="central">UART HMI</text>
  <text x="420" y="398" font-size="24" font-weight="bold" fill="#5DCAA5" dominant-baseline="central">OK</text>
  <text x="790" y="398" font-size="16" fill="#8A96A3" text-anchor="end" dominant-baseline="central">Errores 0 · Descartados 0</text>

  <!-- Teclas -->
  <g font-size="20" text-anchor="middle" dominant-baseline="central">
    <rect x="640" y="434" width="152" height="42" fill="#151C24"/>
    <text x="716" y="455" fill="#85B7EB">Volver</text>
  </g>
</svg>
